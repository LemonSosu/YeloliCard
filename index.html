      radial-gradient(circle at 80% 10%,rgba(173,216,255,0.35),transparent 45%),
      radial-gradient(circle at 50% 90%,rgba(255,223,186,0.3),transparent 50%),
      linear-gradient(160deg,#ffe7f5 0%,#dceaFF 45%,#f6e0ff 100%);
    color:#5a3d7a; overflow-x:hidden; padding-bottom:40px;
  }
  body::before {
    content:""; position:fixed; inset:0;
    background-image:
      radial-gradient(2px 2px at 10% 20%,#ffffff 80%,transparent),
      radial-gradient(1.5px 1.5px at 30% 70%,#ffe9a8 70%,transparent),
      radial-gradient(2px 2px at 60% 40%,#d4f0ff 80%,transparent),
      radial-gradient(1.5px 1.5px at 80% 80%,#ffc7f6 70%,transparent),
      radial-gradient(2px 2px at 90% 30%,#ffffff 80%,transparent);
    background-size:200px 200px; pointer-events:none;
    animation:twinkle 6s ease-in-out infinite alternate; z-index:0;
  }
  @keyframes twinkle { 0%{opacity:0.4} 100%{opacity:1} }
  .app { position:relative; z-index:1; max-width:480px; margin:0 auto; padding:20px 18px; }






  .fairy-banner {
    margin-top:18px; border-radius:24px; overflow:hidden; position:relative; height:200px;
    background:
      linear-gradient(135deg,rgba(255,177,221,0.5),rgba(160,196,255,0.5)),
      url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=60") center/cover;
    border:2px solid rgba(255,255,255,0.8); box-shadow:0 10px 30px rgba(185,130,255,0.45);
  }

  .banner-text { position:absolute; left:16px; bottom:14px; color:#fff; text-shadow:0 2px 8px rgba(106,40,140,0.8); z-index:2; }
  .banner-text .small { font-size:12px; letter-spacing:2px; opacity:0.9; }
  .banner-text .big { font-size:22px; font-weight:bold; margin-top:4px; }
  .magic-circle {
    position:absolute; right:18px; top:18px; width:72px; height:72px; border-radius:50%;
    border:2px dashed rgba(255,255,255,0.85); box-shadow:0 0 18px rgba(255,255,255,0.8);
    z-index:2; animation:rotate 14s linear infinite;
  }
  .magic-circle::after { content:""; position:absolute; inset:8px; border-radius:50%; border:1px solid rgba(255,255,255,0.6); }
  @keyframes rotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .section-title { margin:24px 6px 14px; font-size:17px; font-weight:bold; color:#7b3fa1; display:flex; align-items:center; gap:8px; }
  .section-title::before { content:"\2726"; color:#ff7de0; }
  .section-title::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,#ffb3ec,transparent); }
  .destiny-card {
    background:linear-gradient(135deg,rgba(255,255,255,0.75),rgba(230,210,255,0.55));
    border:1px solid rgba(255,182,230,0.7); border-radius:22px; padding:28px 24px 22px;
    box-shadow:0 8px 24px rgba(185,130,255,0.35); position:relative; overflow:hidden; text-align:center;
  }
  .destiny-card::before { content:""; position:absolute; top:-40px; right:-40px; width:140px; height:140px; background:radial-gradient(circle,rgba(255,210,240,0.7),transparent 70%); border-radius:50%; }
  .destiny-title { font-size:20px; font-weight:bold; color:#9c27b0; margin-bottom:22px; position:relative; z-index:1; }
  .fallback-msg { font-size:14px; color:#b39ddb; margin-top:8px; position:relative; z-index:1; font-style:italic; }
  .place-line { font-size:16px; color:#8754aa; margin-bottom:12px; position:relative; z-index:1; }
  .identity-line { font-size:18px; color:#703494; font-weight:600; margin-bottom:24px; position:relative; z-index:1; }
  .quote-line { font-size:17px; color:#5c307c; line-height:1.7; position:relative; z-index:1; }
  .draw-buttons { margin-top:22px; display:flex; flex-direction:column; gap:12px; position:relative; z-index:1; }
  .draw-btn { width:100%; padding:14px 16px; border:none; border-radius:16px; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; text-align:center; }
  .draw-btn:hover { transform:translateY(-2px); }
  .draw-btn:active { transform:scale(0.98); }
  .draw-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .draw-btn.single { background:linear-gradient(135deg,#ff9de6,#c78fff); box-shadow:0 6px 18px rgba(199,143,255,0.5); }
  .draw-btn.ten { background:linear-gradient(135deg,#82c8ff,#b388ff); box-shadow:0 6px 18px rgba(130,200,255,0.5); }
  .btn-title { font-size:16px; font-weight:bold; color:#fff; letter-spacing:2px; text-shadow:0 2px 6px rgba(120,60,180,0.6); }
  .btn-desc { font-size:12px; color:rgba(255,255,255,0.9); margin-top:4px; text-shadow:0 1px 4px rgba(120,60,180,0.5); }
  .card-modal {
    display:none; position:fixed; inset:0; z-index:999;
    background:linear-gradient(135deg,rgba(80,30,120,0.6),rgba(120,60,160,0.5));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    align-items:center; justify-content:center; padding:20px;
  }
  .card-modal.active { display:flex; animation:modalFadeIn 0.3s ease; }
  @keyframes modalFadeIn { from{opacity:0} to{opacity:1} }
  .card-stage { position:relative; z-index:2; }
  .single-card-wrap { width:240px; perspective:1200px; }
  .single-card-wrap.normal { aspect-ratio:53/125; }
  .single-card-wrap.special { aspect-ratio:65/90; }
  .card-inner {
    width:100%; height:100%; position:relative;
    transform-style:preserve-3d;
    transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);
    transform-origin:center center;
    border-radius:14px; box-shadow:0 12px 40px rgba(60,20,100,0.5);
  }
  .card-inner.flipped { transform:rotateY(-180deg); }
  .card-face {
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:14px; overflow:hidden; border:2px solid rgba(255,255,255,0.8);
    background:linear-gradient(135deg,#e8d0f0,#d4b8e8);
  }
  .card-front { transform:rotateY(180deg); }
  .card-face img { width:100%; height:100%; object-fit:cover; display:block; }
  .modal-tip { position:absolute; bottom:40px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.92); font-size:14px; z-index:2; }
  .result-panel {
    margin-top:20px;
    background:linear-gradient(135deg,rgba(255,255,255,0.75),rgba(230,210,255,0.55));

  .result-stat .label { font-size:11px; color:#7b5aa1; margin-top:2px; }

  .result-list .rarity-hide { color:#673ab7; }
  .result-list .rarity-high { color:#3f51b5; }
  .result-list .rarity-mid { color:#009688; }
  .result-list .rarity-low { color:#607d8b; }
  .count-panel {

    <div class="count-item"><div class="num" id="countLow">0</div><div class="label">低卡位</div></div>
  </div>
</div>

<div class="card-modal" id="cardModal">
  <div class="card-stage" id="cardStage"></div>
  <div class="modal-tip" id="modalTip">点击屏幕翻开卡牌</div>
</div>

    "special": "https://imgaly.51shazhu.com/autoupload/gxnv5/20260911/folder-mtwyxr10-0jjfkruw/%E3%80%90%E8%A3%81%E5%88%86%E3%80%91%E5%8F%B6%E7%BD%97%E4%B8%BD%E5%8D%A1%E7%89%8C%E8%87%AA%E6%8A%BD/%E7%89%B9%E5%85%B8%E5%8D%A1%E8%83%8C.jpg",
    "normal": "https://imgaly.51shazhu.com/autoupload/gxnv5/20260911/folder-mtwyxr10-0jjfkruw/%E3%80%90%E8%A3%81%E5%88%86%E3%80%91%E5%8F%B6%E7%BD%97%E4%B8%BD%E5%8D%A1%E7%89%8C%E8%87%AA%E6%8A%BD/%E5%8D%A1%E8%83%8C.jpg"
  },
  "fallback_img": "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27375%27 viewBox=%270 0 200 375%27%3E%3Crect fill=%27%23e8d0f0%27 width=%27200%27 height=%27375%27/%3E%3Ctext x=%27100%27 y=%27190%27 text-anchor=%27middle%27 fill=%27%239c27b0%27 font-size=%2716%27 font-family=%27sans-serif%27%3E%E2%9C%A8 %E5%8F%B6%E7%BD%97%E4%B8%BD%3C/text%3E%3C/svg%3E"
};
// ===== 配置区 END =====

function initConfig(callback) {
  CARDS = CONFIG.cards;
  BACK_SPECIAL = CONFIG.card_backs.special;
  BACK_NORMAL = CONFIG.card_backs.normal;
  FALLBACK_IMG = CONFIG.fallback_img || BACK_NORMAL;
  GROUPS = [];
  for (var name in CONFIG.weights) {
    GROUPS.push({ name: name, weight: CONFIG.weights[name], backType: CONFIG.back_types[name] });
  }
  if (callback) callback(CONFIG.fate_pool);
}

function getTodayStr() {
  var d = new Date();
  var mm = d.getMonth()+1; var dd = d.getDate();
  return d.getFullYear() + "-" + (mm<10?"0":"") + mm + "-" + (dd<10?"0":"") + dd;
}

function initCountData() {
  var today = getTodayStr();
  var s = localStorage.getItem(DRAW_COUNT_KEY);
  if (s) { try { var d = JSON.parse(s); if (d.date === today) return d; } catch(e) {} }
  return { date:today, counts:{"限定":0,"特典":0,"隐藏卡":0,"高卡位":0,"中卡位":0,"低卡位":0} };
}

function saveCountData(d) { localStorage.setItem(DRAW_COUNT_KEY, JSON.stringify(d)); }

function updateCountView() {
  var d = initCountData();
  document.getElementById("countLimit").textContent = d.counts["限定"];
  document.getElementById("countSpecial").textContent = d.counts["特典"];
  document.getElementById("countHide").textContent = d.counts["隐藏卡"];
  document.getElementById("countHigh").textContent = d.counts["高卡位"];
  document.getElementById("countMid").textContent = d.counts["中卡位"];
  document.getElementById("countLow").textContent = d.counts["低卡位"];
}

function getDailyFateCard(fatePool) {
  var today = getTodayStr();
  var s = localStorage.getItem(DAILY_FATE_KEY);
  if (s) { try { var c = JSON.parse(s); if (c.date === today) return c.cardObj; } catch(e) {} }
  var card = fatePool[Math.floor(Math.random() * fatePool.length)];
  localStorage.setItem(DAILY_FATE_KEY, JSON.stringify({date:today, cardObj:card}));
  return card;
}

function renderFateCard(card) {
  var fb = document.getElementById("fallbackMsg");
  var pt = document.getElementById("placeText");
  var id = document.getElementById("idText");
  var mt = document.getElementById("msgText");
  if (!card || !card.name) {
    fb.style.display = "block";
    pt.style.display = "none"; id.style.display = "none"; mt.style.display = "none";
    return;
  }
  fb.style.display = "none";
  pt.style.display = ""; id.style.display = ""; mt.style.display = "";
  pt.innerText = "今日" + card.place + "值守者";
  id.innerText = (card.title && card.title.length > 0) ? (card.title + " \u2014\u2014 " + card.name) : card.name;
  mt.innerText = "\u300c" + card.message + "\u300d";
}

function handleImgError(img) {
  img.onerror = null;
  img.src = FALLBACK_IMG;
}

function getCardBack(backType) {
  return backType === "special" ? BACK_SPECIAL : BACK_NORMAL;
}

function randomGroup() {
  var total = 0;
  for (var i = 0; i < GROUPS.length; i++) total += GROUPS[i].weight;
  var r = Math.random() * total;
  for (var j = 0; j < GROUPS.length; j++) {
    r -= GROUPS[j].weight;
    if (r <= 0) return GROUPS[j];
  }
  return GROUPS[GROUPS.length - 1];
}

function buildSingleCard(card) {
  var backSrc = getCardBack(card.backType);
  var frontSrc = card.img || FALLBACK_IMG;
  return '<div class="single-card-wrap ' + card.backType + '"><div class="card-inner" id="flipCard">'
    + '<div class="card-face card-back"><img src="' + backSrc + '" onerror="handleImgError(this)" alt="\u5361\u80cc"></div>'
    + '<div class="card-face card-front"><img src="' + frontSrc + '" onerror="handleImgError(this)" alt="\u5361\u9762"></div>'
    + '</div></div>';
}

function renderResult(drawnCards) {
  var stats = {"限定":0,"特典":0,"隐藏卡":0,"高卡位":0,"中卡位":0,"低卡位":0};
  var rarityClass = {"限定":"rarity-limit","特典":"rarity-special","隐藏卡":"rarity-hide","高卡位":"rarity-high","中卡位":"rarity-mid","低卡位":"rarity-low"};
  var listHtml = "";
  for (var i = 0; i < drawnCards.length; i++) {
    var c = drawnCards[i];
    stats[c.groupName]++;
    listHtml += '<div><span class="' + rarityClass[c.groupName] + '">[' + c.groupName + ']</span> \u7b2c' + (c.index+1) + '\u53f7</div>';
  }
  document.getElementById("resultStats").innerHTML = '<div class="result-stat"><div class="num">' + stats["限定"] + '</div><div class="label">\u9650\u5b9a</div></div>' + '<div class="result-stat"><div class="num">' + stats["特典"] + '</div><div class="label">\u7279\u5178</div></div>' + '<div class="result-stat"><div class="num">' + stats["隐藏卡"] + '</div><div class="label">\u9690\u85cf</div></div>' + '<div class="result-stat"><div class="num">' + stats["高卡位"] + '</div><div class="label">\u9ad8</div></div>' + '<div class="result-stat"><div class="num">' + stats["中卡位"] + '</div><div class="label">\u4e2d</div></div>' + '<div class="result-stat"><div class="num">' + stats["低卡位"] + '</div><div class="label">\u4f4e</div></div>';
  document.getElementById("resultList").innerHTML = listHtml;
  document.getElementById("resultPanel").style.display = "block";
  var data = initCountData();
  for (var j = 0; j < drawnCards.length; j++) { data.counts[drawnCards[j].groupName]++; }
  saveCountData(data);
  updateCountView();
}

function showNextCard() {
  if (seqIndex >= currentDrawnCards.length) {
    renderResult(currentDrawnCards);
    cardModal.classList.remove("active");
    document.getElementById("drawSingle").disabled = false;
    document.getElementById("drawTen").disabled = false;
    return;
  }
  var card = currentDrawnCards[seqIndex];
  cardStage.innerHTML = buildSingleCard(card);
  seqPhase = "back";
  modalTip.textContent = "\u70b9\u51fb\u7ffb\u5f00";
}

function handleModalClick() {
  if (seqPhase === "back") {
    var el = document.getElementById("flipCard");
    if (el) el.classList.add("flipped");
    seqPhase = "flipped";
    modalTip.textContent = "\u70b9\u51fb\u67e5\u770b\u4e0b\u4e00\u5f20";
  } else if (seqPhase === "flipped") {
    seqIndex++;
    showNextCard();
  }
}

cardModal = null;
function bindModalClick() {
  if (!cardModal) cardModal = document.getElementById("cardModal");
  cardModal.addEventListener("click", function(e) {
    if (e.target === cardModal) return;
    handleModalClick();
  });
}

function drawCard(times) {
  document.getElementById("drawSingle").disabled = true;
  document.getElementById("drawTen").disabled = true;
  currentDrawnCards = [];
  for (var i = 0; i < times; i++) {
    var g = randomGroup();
    var pool = CARDS[g.name];
    var idx = Math.floor(Math.random() * pool.length);
    currentDrawnCards.push({ groupName:g.name, backType:g.backType, index:idx, img:pool[idx] });
  }
  seqIndex = 0;
  seqPhase = "idle";
  cardModal.classList.add("active");
  showNextCard();
}

window.addEventListener("load", function() {
  cardModal = document.getElementById("cardModal");
  cardStage = document.getElementById("cardStage");
  modalTip = document.getElementById("modalTip");
  bindModalClick();
  initConfig(function(fatePool) {
    updateCountView();
    var dailyCard = getDailyFateCard(fatePool);
    renderFateCard(dailyCard);
    document.getElementById("drawSingle").addEventListener("click", function(){ drawCard(1); });
    document.getElementById("drawTen").addEventListener("click", function(){ drawCard(10); });
  });
});
</script></body></html>
